<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoWidget — Волинська область</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f0fdf4; }
    eco-widget { display: block; height: 100vh; }
  </style>
</head>
<body>

  <eco-widget
    region="volyn"
    lang="uk"

  <!-- Бандл + стилі -->
  <link  rel="stylesheet" href="/dist/eco-widget.css">
