services:
  eco-widget:
    build: .
    container_name: eco-widget
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DB_PATH=/data/eco_data.db
    volumes:
      - eco_data:/data
    networks:
      - eco-net
      - npm_default

  adminer:
    image: adminer:latest
    container_name: eco-adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=eco-widget
    ports:
      - "8888:8080"
    networks:
      - eco-net

volumes:
  eco_data:

networks:
  eco-net:
  npm_default:
    external: true
