services:
  eco-widget:
    build: .
    container_name: eco-widget
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DB_PATH=/data/eco_data.db
    volumes:
      - eco_data:/data
    networks:
      - eco-net

  nginx:
    image: nginx:alpine
    container_name: eco-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - eco-widget
    networks:
      - eco-net

  adminer:
    image: adminer:latest
    container_name: eco-adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=eco-widget
    ports:
      - "8080:8080"
    networks:
      - eco-net

volumes:
  eco_data:

networks:
  eco-net:
