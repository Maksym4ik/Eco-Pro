<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWidget — Волинська область</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1e2533;
            --border: #2a3040;
            --accent: #4f8ef7;
            --accent2: #34d399;
            --warn: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text2: #8b98b0;
            --radius: 10px;
            --sidebar: 280px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            flex-shrink: 0
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -.5px
        }

        .logo span {
            color: var(--accent2)
        }

        .sdot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent2);
            box-shadow: 0 0 6px var(--accent2);
            animation: pulse 2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .stext {
            font-size: 12px;
            color: var(--text2)
        }

        .lupd {
            margin-left: auto;
            font-size: 11px;
            color: var(--text2)
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden
        }

        .sidebar {
            width: var(--sidebar);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0
        }

        .ss {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border)
        }

        .st {
            font-size: 10px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 9px
        }

        .fg {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .fi {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 7px;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s;
            user-select: none
        }

        .fi:hover {
            background: var(--surface2)
        }

        .fi input {
            display: none
        }

        .fd {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .fl {
            font-size: 12px;
            flex: 1
        }

        .fb {
            font-size: 10px;
            background: var(--surface2);
            padding: 1px 5px;
            border-radius: 8px;
            color: var(--text2)
        }

        .fi.active .fl {
            color: var(--text);
            font-weight: 500
        }

        .fi:not(.active) {
            opacity: .45
        }

        .di {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 12px
        }

        .tw {
            margin-top: 9px
        }

        .tl {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .tv {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin-bottom: 5px
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer
        }

        .li {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .lc {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0
        }

        .btn {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s
        }

        .bp {
            background: var(--accent);
            color: #fff
        }

        .bp:hover {
            opacity: .85
        }

        .bs {
            background: var(--surface2);
            color: var(--text);
            margin-top: 5px;
            border: 1px solid var(--border)
        }

        .mw {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        #map {
            flex: 1
        }

        .bp2 {
            background: var(--surface);
            border-top: 1px solid var(--border);
            height: 260px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0
        }

        .pt {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .tab {
            padding: 9px 16px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text2);
            border-bottom: 2px solid transparent;
            transition: all .15s
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .pc {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start
        }

        .pc.active {
            display: flex
        }

        .dc {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            min-width: 130px;
            flex: 1
        }

        .dct {
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .dcv {
            font-size: 20px;
            font-weight: 700
        }

        .dcu {
            font-size: 10px;
            color: var(--text2);
            margin-left: 3px
        }

        .dcs {
            font-size: 10px;
            margin-top: 3px;
            padding: 2px 7px;
            border-radius: 8px;
            display: inline-block
        }

        .good {
            color: #34d399;
            background: rgba(52, 211, 153, .12)
        }

        .moderate {
            color: #f59e0b;
            background: rgba(245, 158, 11, .12)
        }

        .poor {
            color: #ef4444;
            background: rgba(239, 68, 68, .12)
        }

        .cw {
            flex: 2;
            min-width: 260px;
            height: 200px;
            position: relative
        }

        .sl {
            width: 100%;
            font-size: 12px
        }

        .sr {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 10px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border)
        }

        .sr:last-child {
            border: none
        }

        .sn {
            font-weight: 500;
            font-size: 12px
        }

        .sloc {
            font-size: 10px;
            color: var(--text2)
        }

        .pill {
            padding: 2px 7px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600
        }

        .nd {
            color: var(--text2);
            font-size: 12px;
            padding: 16px;
            text-align: center;
            width: 100%
        }

        .apik {
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .3);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--warn);
            margin-top: 8px;
            line-height: 1.5
        }

        .apik a {
            color: var(--accent);
            text-decoration: none
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-track {
            background: var(--surface)
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        .fi[data-tip] {
            position: relative
        }

        .fi[data-tip]:hover::after {
            content: attr(data-tip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background: #1e2533;
            border: 1px solid #2a3040;
            color: #e2e8f0;
            font-size: 10px;
            padding: 5px 8px;
            border-radius: 6px;
            white-space: normal;
            width: 200px;
            z-index: 9999;
            margin-left: 6px;
            line-height: 1.4;
            pointer-events: none
        }

        .temp-chip {
            background: #1d4ed8;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .5)
        }

        .wind-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 9px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8)
        }

        .wind-arrow svg {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6))
        }

        .leaflet-popup-content-wrapper {
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
            color: var(--text) !important;
            border-radius: var(--radius) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6) !important
        }

        .leaflet-popup-tip {
            background: var(--surface) !important
        }

        .ppt {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
            color: var(--accent)
        }

        .ppr {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 11px;
            padding: 3px 0;
            border-bottom: 1px solid var(--border)
        }

        .ppr:last-child {
            border: none
        }

        .ppv {
            font-weight: 600
        }

        #lov {
            position: absolute;
            top: 50%;
            left: calc(var(--sidebar) + 50%);
            transform: translate(-50%, -50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 26px;
            text-align: center;
            z-index: 9999;
            display: none
        }

        #lov.show {
            display: block
        }

        .sp {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">LNTU<span>EcoWidget</span></div>
        <div class="sdot" id="sdot"></div>
        <div class="stext" id="stxt">Завантаження...</div>
        <div class="lupd" id="lupd"></div>
        <button onclick="loadAll()" title="Оновити дані"
            style="background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:15px;line-height:1;margin-left:8px"
            onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text2)'">↻</button>
    </header>

    <div class="main">
        <div class="sidebar">
            <div class="ss">
                <div class="st">Параметри</div>
                <div class="fg" id="fg">
                    <label class="fi active" data-p="pm25"
                        data-tip="Дрібні частинки < 2.5 мкм. Проникають у легені, небезпечні для серцево-судинної системи"><input
                            type="checkbox" checked>
                        <div class="fd" style="background:#ef4444"></div><span class="fl">PM2.5</span><span
                            class="fb">SaveEcoBot</span>
                    </label>
                    <label class="fi active" data-p="pm10"
                        data-tip="Тверді частинки < 10 мкм. Викликають алергії та захворювання органів дихання"><input
                            type="checkbox" checked>
                        <div class="fd" style="background:#f59e0b"></div><span class="fl">PM10</span><span
                            class="fb">SaveEcoBot</span>
                    </label>
                    <label class="fi active" data-p="aqi"
                        data-tip="Air Quality Index (США). 0–50 добра якість, 51–100 помірна, 101+ шкідлива"><input
                            type="checkbox" checked>
                        <div class="fd" style="background:#e879f9"></div><span class="fl">AQI</span><span
                            class="fb">IQAir / SaveEcoBot</span>
                    </label>
                    <label class="fi active" data-p="temp"
                        data-tip="Температура повітря в °C за даними Open-Meteo для кожної точки"><input type="checkbox"
                            checked>
                        <div class="fd" style="background:#60a5fa"></div><span class="fl">Температура</span><span
                            class="fb">Open-Meteo</span>
                    </label>
                    <label class="fi active" data-p="humidity"
                        data-tip="Відносна вологість повітря у % за даними Open-Meteo"><input type="checkbox" checked>
                        <div class="fd" style="background:#34d399"></div><span class="fl">Вологість</span><span
                            class="fb">Open-Meteo</span>
                    </label>
                    <label class="fi active" data-p="wind_speed"
                        data-tip="Швидкість вітру в м/с на висоті 10м за даними Open-Meteo"><input type="checkbox"
                            checked>
                        <div class="fd" style="background:#a78bfa"></div><span class="fl">Вітер</span><span
                            class="fb">Open-Meteo</span>
                    </label>
                    <label class="fi active" data-p="pressure"
                        data-tip="Атмосферний тиск у гПа за даними Open-Meteo"><input type="checkbox" checked>
                        <div class="fd" style="background:#fb923c"></div><span class="fl">Тиск</span><span
                            class="fb">Open-Meteo</span>
                    </label>
                </div>
            </div>

            <div class="ss">
                <div class="st">Шари</div>
                <div class="fg" id="lg">
                    <label class="fi active" data-l="stations"><input type="checkbox" checked>
                        <div class="fd" style="background:#4f8ef7"></div><span class="fl">Станції</span><span
                            class="fb">SaveEcoBot / IQAir</span>
                    </label>
                    <label class="fi active" data-l="region"><input type="checkbox" checked>
                        <div class="fd" style="background:#34d399"></div><span class="fl">Межі Волині</span><span
                            class="fb">OSM</span>
                    </label>
                    <label class="fi active" data-l="ecowitt"><input type="checkbox" checked>
                        <div class="fd" style="background:#34d399"></div><span class="fl">🌿 EcoWitt ЛНТУ</span><span
                            class="fb">EcoWitt</span>
                    </label>
                    <label class="fi" data-l="radiation"><input type="checkbox">
                        <div class="fd" style="background:#34d399"></div><span class="fl">Радіація ☢️</span><span
                            class="fb">SaveEcoBot</span>
                    </label>
                    <label class="fi" data-l="temp-grid"><input type="checkbox">
                        <div class="fd" style="background:#60a5fa"></div><span class="fl">🌡 Температура
                            (сітка)</span><span class="fb">Open-Meteo</span>
                    </label>
                    <label class="fi" data-l="wind-grid"><input type="checkbox">
                        <div class="fd" style="background:#a78bfa"></div><span class="fl">💨 Вітер (сітка)</span><span
                            class="fb">Open-Meteo</span>
                    </label>
                </div>
            </div>

            <div class="ss">
                <div class="st">AQI — Легенда</div>
                <div class="li">
                    <div class="lc" style="background:#34d399"></div>0–50 Добра
                </div>
                <div class="li">
                    <div class="lc" style="background:#fbbf24"></div>51–100 Помірна
                </div>
                <div class="li">
                    <div class="lc" style="background:#f97316"></div>101–150 Нездорова для чутл.
                </div>
                <div class="li">
                    <div class="lc" style="background:#ef4444"></div>151–200 Нездорова
                </div>
                <div class="li">
                    <div class="lc" style="background:#7c3aed"></div>201+ Небезпечна
                </div>
            </div>

            <div class="ss">
                <button class="btn bs" onclick="exportCSV()">📥 Експорт CSV</button>
            </div>
        </div>

        <div class="mw">
            <div id="map"></div>
            <div class="bp2">
                <div class="pt">
                    <div class="tab active" onclick="swTab('st',this)">📍 Станції</div>
                    <div class="tab" onclick="swTab('wx',this)">🌤 Погода</div>
                    <div class="tab" onclick="swTab('iq',this)">🟣 IQAir</div>
                    <div class="tab" onclick="swTab('ew',this)">🌿 EcoWitt</div>
                </div>
                <div class="pc active" id="tab-st"></div>
                <div class="pc" id="tab-wx"></div>
                <div class="pc" id="tab-iq"></div>
                <div class="pc" id="tab-ew"></div>
            </div>
        </div>
    </div>

    <div id="lov">
        <div class="sp"></div>
        <div style="margin-top:10px;font-size:12px;color:var(--text2)">Завантаження даних...</div>
    </div>

    <script>
        // ═══════════════════════════════════════════════

        // ═══════════════════════════════════════════════

        };

        // Відомі станції Волині
        const KNOWN = [
            { name: 'Луцьк — Центр', lat: 50.7472, lng: 25.3254, city: 'Луцьк' },

            { name: 'Луцьк — Теремно', lat: 50.7750, lng: 25.3600, city: 'Луцьк' },
            { name: 'Ковель', lat: 51.2108, lng: 24.7068, city: 'Ковель' },
            { name: 'Нововолинськ', lat: 51.2320, lng: 24.1600, city: 'Нovovolynsk' },
            { name: 'Володимир', lat: 50.8480, lng: 24.3230, city: 'Володимир' },
            { name: 'Рожище', lat: 50.9140, lng: 25.2720, city: 'Рожище' },
            { name: 'Горохів', lat: 50.5010, lng: 24.7780, city: 'Горохів' },
            { name: 'Камінь-Каширський', lat: 51.6250, lng: 24.9960, city: 'Камінь-Каширський' },
            { name: 'Ківерці', lat: 50.6960, lng: 25.4610, city: 'Ківерці' },
            { name: 'Локачі', lat: 50.7390, lng: 24.6280, city: 'Локачі' },
        ];

        const PC = { pm25: '#ef4444', pm10: '#f59e0b', aqi: '#e879f9', temp: '#60a5fa', humidity: '#34d399', wind_speed: '#a78bfa', pressure: '#fb923c' };
        const PL = { pm25: 25, pm10: 50, aqi: 100, temp: 35, humidity: 85, wind_speed: 15, pressure: 1025 };
        const PN = { pm25: 'PM2.5', pm10: 'PM10', aqi: 'AQI', temp: 'Температура', humidity: 'Вологість', wind_speed: 'Вітер', pressure: 'Тиск' };

        function aqiColor(v, lim) { const r = v / lim; if (r < .5) return '#34d399'; if (r < 1) return '#fbbf24'; if (r < 1.5) return '#f97316'; if (r < 2) return '#ef4444'; return '#7c3aed' }
        function aqiLabel(v, lim) { const r = v / lim; if (r < .5) return ['Добра', 'good']; if (r < 1) return ['Помірна', 'moderate']; return ['Погана', 'poor'] }
        function rnd(a, b) { return +(Math.random() * (b - a) + a).toFixed(2) }

        function simData(st) {
            const h = S.hour, tf = ((h >= 7 && h <= 9) || (h >= 17 && h <= 19)) ? 1.45 : 1, nf = (h >= 1 && h <= 5) ? .5 : 1, f = tf * nf;
            const pm25 = rnd(5 * f, 30 * f), pm10 = rnd(pm25 * 1.3, pm25 * 2.2);
            const aqi = Math.round(pm25 < 12 ? pm25 * 4.2 : pm25 < 35.4 ? 50 + (pm25 - 12) * 2.1 : 100 + (pm25 - 35.4) * 1.5);
            return {
                pm25, pm10, no2: rnd(4 * f, 40 * f), o3: rnd(20 / f, 85 / f), co: rnd(180 * f, 1100 * f), so2: rnd(.5, 12 * f),
                temp: rnd(-3, 24), humidity: rnd(42, 88), pressure: rnd(1000, 1025), wind_speed: rnd(.5, 7), aqi, source: 'sim'
            };
        }

        // Point-in-polygon (ray-casting). poly = масив [lng, lat] пар (GeoJSON)
        function pip(lat, lng, poly) { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) ins = !ins; } return ins; }
        // Перевірка з пріоритетом точного полігону OSM, fallback на спрощений VOLYN
        function inRegion(lat, lng) {
            const polys = S.volynPoly || (VOLYN.features[0].geometry.coordinates);
            return polys.some(p => pip(lat, lng, p));
        }

        function radColor(v) {
            if (v < 0.10) return '#34d399';
            if (v < 0.30) return '#fbbf24';
            if (v < 1.00) return '#f97316';
            return '#ef4444';
        }
        function radLabel(v) {
            if (v < 0.10) return ['Норма', 'good'];
            if (v < 0.30) return ['Підвищений', 'moderate'];
            return ['Небезпечний', 'poor'];
        }

        async function fetchSaveecobot() {
            try {
                // Публічний файл даних Saveecobot (всі датчики)
                const r = await fetch('/proxy/saveecobot-maps/maps_data.js', {
                    headers: { Accept: 'application/json', 'Referer': 'https://www.saveecobot.com/' }
                });
                if (!r.ok) return { radiation: [], air: [] };
                const d = await r.json();
                const all = d.devices || [];

                const inVolyn = s => {
                    const lat = parseFloat(s.a), lng = parseFloat(s.n);
                    return !isNaN(lat) && !isNaN(lng) && inRegion(lat, lng);
                };
                const volyn = all.filter(inVolyn);

                // Радіаційні датчики (gamma в нСв/год)
                const radiation = volyn
                    .filter(s => s.gamma != null)
                    .map(s => ({
                        id: s.i, lat: parseFloat(s.a), lng: parseFloat(s.n),
                        value: parseFloat(s.gamma) / 1000,  // нСв/год → мкСв/год
                        valueRaw: s.gamma, unit: 'мкЗв/год',
                        old: s.oldr === 1, source: 'saveecobot',
                    }));

                // Датчики якості повітря (PM2.5, AQI)
                const air = volyn
                    .filter(s => s.pm25 != null && s.old === 0)
                    .map(s => ({
                        id: s.i, lat: parseFloat(s.a), lng: parseFloat(s.n),
                        pm25: parseFloat(s.pm25), aqi: s.aqi,
                        pm10: s.pm10 != null ? parseFloat(s.pm10) : null,
                        source: 'saveecobot', name: `SEB-${s.i}`, city: '',
                    }));

                return { radiation, air };
            } catch { return { radiation: [], air: [] } }
        }

        async function fetchEcoWitt() {
            if (!CFG.ECOWITT_APP_KEY || !CFG.ECOWITT_API_KEY || !CFG.ECOWITT_MAC) return null;
            try {
                const u = new URL('https://api.ecowitt.net/api/v3/device/real_time');
                u.searchParams.set('application_key', CFG.ECOWITT_APP_KEY);
                u.searchParams.set('api_key', CFG.ECOWITT_API_KEY);
                u.searchParams.set('mac', CFG.ECOWITT_MAC);
                u.searchParams.set('call_back', 'all');
                u.searchParams.set('temp_unitid', '1');
                u.searchParams.set('pressure_unitid', '5');
                u.searchParams.set('wind_speed_unitid', '7');
                u.searchParams.set('rainfall_unitid', '12');
                u.searchParams.set('solar_irradiance_unitid', '16');
                const r = await fetch(u);
                const d = await r.json();
                if (d.code !== 0) return null;
                const o = d.data || {};
                const fv = (obj, k) => obj?.[k]?.value !== undefined ? parseFloat(obj[k].value) : null;
                return {
                    tempOut: fv(o.outdoor, 'temperature'), humOut: fv(o.outdoor, 'humidity'),
                    dewPoint: fv(o.outdoor, 'dew_point'), feelsLike: fv(o.outdoor, 'feels_like'),
                    tempIn: fv(o.indoor, 'temperature'), humIn: fv(o.indoor, 'humidity'),
                    windSpeed: fv(o.wind, 'wind_speed'), windGust: fv(o.wind, 'wind_gust'),
                    windDir: fv(o.wind, 'wind_direction'),
                    pressureRel: fv(o.pressure, 'relative'), pressureAbs: fv(o.pressure, 'absolute'),
                    solar: fv(o.solar_and_uvi, 'solar'), uvi: fv(o.solar_and_uvi, 'uvi'),
                    rainRate: fv(o.rainfall, 'rain_rate'), rainDaily: fv(o.rainfall, 'daily'),
                    soilTemp: fv(o.soil_ch1, 'soiltemp'), soilMoisture: fv(o.soil_ch1, 'soilmoisture'),
                    leafWetness: fv(o.leaf_ch1, 'leaf_wetness'),
                    tempCh7: fv(o.temp_and_humidity_ch7, 'temperature'),
                    humCh7: fv(o.temp_and_humidity_ch7, 'humidity'),
                };
            } catch { return null }
        }

        // ═══════════════════════════════════════════════
        // MAP INIT
        // ═══════════════════════════════════════════════
        const map = L.map('map', { center: [50.95, 25.0], zoom: 9 });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Region border — fallback polygon, буде замінено точним контуром з OSM
        const REGION_STYLE = { color: '#4f8ef7', weight: 2, fillColor: '#4f8ef7', fillOpacity: .06, dashArray: '6,4' };
        S.regionLayer = L.geoJSON(VOLYN, { style: REGION_STYLE }).addTo(map);
        map.setView([51.0, 25.0], 8);

        // Асинхронно підвантажуємо точний контур Волинської обл. з OSM (R71064)
        fetch('https://nominatim.openstreetmap.org/lookup?osm_ids=R71064&format=geojson&polygon_geojson=1')
            .then(r => r.json())
            .then(geojson => {
                if (!geojson?.features?.length) return;
                map.removeLayer(S.regionLayer);
                S.regionLayer = L.geoJSON(geojson, { style: REGION_STYLE }).addTo(map);
                // Зберігаємо точний полігон для point-in-polygon фільтрації
                const geo = geojson.features[0].geometry;
                if (geo.type === 'Polygon') S.volynPoly = geo.coordinates;
                else if (geo.type === 'MultiPolygon') S.volynPoly = geo.coordinates.flat(1);
                // Перефільтровуємо радіацію точним контуром і перемальовуємо
                if (S.volynPoly && S.radiation.length) {
                    const before = S.radiation.length;
                    S.radiation = S.radiation.filter(s => inRegion(s.lat, s.lng));
                    if (S.radiation.length !== before) {
                        renderRadiation();
                        const radSt = S.radiation.length ? `☢️ ${S.radiation.length}` : '☢️ —';
                        const el = document.getElementById('stxt');
                        if (el) el.textContent = el.textContent.replace(/☢️ \S+/, radSt);
                    }
                }
            })
            .catch(() => { });

        // ═══════════════════════════════════════════════
        // API CALLS
        // ═══════════════════════════════════════════════
        async function fetchOpenAQ() {
            try {
                const r = await fetch('https://api.openaq.org/v3/locations?coordinates=50.95,25.0&radius=130000&limit=25', { headers: { Accept: 'application/json' } });
                if (!r.ok) return [];
                const d = await r.json();
                return (d.results || []).map(l => ({
                    name: l.name || l.locality || 'OpenAQ станція', lat: l.coordinates?.latitude, lng: l.coordinates?.longitude,
                    city: l.locality || '—', id: l.id, source: 'openaq'
                })).filter(x => x.lat && x.lng);
            } catch { return [] }
        }

        async function fetchMeasurements(id) {
            try {
                const r = await fetch(`https://api.openaq.org/v3/locations/${id}/latest`, { headers: { Accept: 'application/json' } });
                if (!r.ok) return null;
                const d = await r.json(); const out = {};
                for (const m of (d.results || [])) { const p = m.parameter?.toLowerCase().replace('.', ''); if (p) out[p] = m.value; }
                return Object.keys(out).length ? out : null;
            } catch { return null }
        }

        async function fetchWeather(lat = 50.7472, lng = 25.3254) {
            try {
                const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,surface_pressure,weather_code&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&forecast_days=1&timezone=Europe%2FKyiv`;
                const r = await fetch(u); return await r.json();
            } catch { return null }
        }

        async function fetchIQAir() {
            if (!CFG.IQAIR_KEY) return null;
            // IQAir Nearest City endpoint
            try {
                const u = `https://api.airvisual.com/v2/nearest_city?lat=50.7472&lon=25.3254&key=${CFG.IQAIR_KEY}`;

        // ═══════════════════════════════════════════════
        // MAIN LOADER
        // ═══════════════════════════════════════════════
        async function loadAll() {
            showLoad(true);
            document.getElementById('stxt').textContent = 'Отримання даних...';

            const [aqLocs, wx, iq, rad, ew] = await Promise.all([
                fetchOpenAQ(), fetchWeather(), fetchIQAir(),
                fetchSaveecobot(), fetchEcoWitt(),
            ]);

            // Відстань між двома точками (км)
            const km = (a, b) => { const R = 6371, p = Math.PI / 180, dl = (b.lat - a.lat) * p, dn = (b.lng - a.lng) * p; return R * 2 * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin(dn / 2) ** 2)); };

            // Будуємо список лише з реальних джерел
            const realSt = [];

            // 1. SaveEcoBot — датчики якості повітря
            const usedNames = new Set();
            for (const air of (rad.air || [])) {
                let near = KNOWN[0], nearD = Infinity;
                for (const k of KNOWN) { const d = km(k, air); if (d < nearD) { nearD = d; near = k; } }
                const baseName = nearD < 8 ? near.name : `SaveEcoBot #${air.id}`;
                const name = usedNames.has(baseName) ? `${baseName} #${air.id}` : baseName;
                usedNames.add(name);
                realSt.push({
                    name, lat: air.lat, lng: air.lng,
                    city: nearD < 20 ? near.city : 'Волинська обл.',
                    data: { pm25: air.pm25, aqi: air.aqi || null, pm10: air.pm10 || null, source: 'saveecobot' },
                    hasReal: true, sebSource: true
                });
            }

            // 2. IQAir — Луцьк-центр (якщо ще немає поблизу)
            if (iq) {
                const lutsk = { name: 'Луцьк — Центр', lat: 50.7472, lng: 25.3254, city: 'Луцьк' };
                const dup = realSt.some(s => km(s, lutsk) < 3);
                if (!dup) realSt.push({
                    ...lutsk,
                    data: {
                        aqi: iq.current?.pollution?.aqius, pm25: iq.current?.pollution?.p2?.conc,
                        temp: iq.current?.weather?.tp, humidity: iq.current?.weather?.hu,
                        wind_speed: iq.current?.weather?.ws, pressure: iq.current?.weather?.pr, source: 'iqair'
                    },
                    hasReal: true, iqSource: true
                });
            }

            // Open-Meteo — погода для кожної станції паралельно
            await Promise.all(realSt.map(async st => {
                const wx2 = await fetchWeather(st.lat, st.lng);
                st.wx = wx2;
                if (wx2?.current) {
                    const c = wx2.current;
                    st.data.temp = c.temperature_2m;
                    st.data.humidity = c.relative_humidity_2m;
                    st.data.wind_speed = c.wind_speed_10m;
                    st.data.pressure = c.surface_pressure;
                    st.data.weather_code = c.weather_code;
                }
            }));

            S.stations = realSt;
            S.weather = realSt[0]?.wx || null; // Для зворотної сумісності — перша станція
            S.iqair = iq;
            // Якщо точний полігон OSM вже завантажено — фільтруємо одразу
            S.radiation = (rad.radiation || []).filter(s => !S.volynPoly || inRegion(s.lat, s.lng));
            S.sebAir = rad.air || [];
            S.ecowitt = ew;

            renderMap();
            renderRadiation();
            renderEWMarker();
            // Сітка температури/вітру (в фоні)
            fetchGridForecast().then(gd => { S.gridData = gd; buildTempLayer(); buildWindLayer(); }).catch(() => { });
            renderAll();
            document.getElementById('lupd').textContent = `Оновлено: ${new Date().toLocaleTimeString('uk-UA')}`;
            const radSt = S.radiation.length ? `☢️ ${S.radiation.length}` : '☢️ —';
            const ewSt = ew ? '🌿 ✅' : CFG.ECOWITT_APP_KEY ? '🌿 ❌' : '🌿 —';
            document.getElementById('stxt').textContent = `Станцій: ${S.stations.length} | IQAir: ${iq ? '✅' : '⚠️'} | Радіація: ${radSt} | EcoWitt: ${ewSt}`;
            showLoad(false);
        }

        // ═══════════════════════════════════════════════
        // MAP RENDER
        // ═══════════════════════════════════════════════
        function renderRadiation() {
            S.radMarkers.forEach(m => map.removeLayer(m));
            S.radMarkers = [];
            if (!S.layers.has('radiation') || !S.radiation.length) return;
            for (const s of S.radiation) {
                const col = radColor(s.value);
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:${col};width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 10px ${col};display:flex;align-items:center;justify-content:center;font-size:8px">☢</div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });
                const [lbl] = radLabel(s.value);
                const mk = L.marker([s.lat, s.lng], { icon }).addTo(map).bindPopup(
                    `<div><div class="ppt">☢️ Датчик #${s.id}</div>
                <div class="ppr"><span>Доза</span><span class="ppv">${s.value?.toFixed(3) || '—'} ${s.unit}</span></div>
                <div class="ppr"><span>Статус</span><span class="ppv">${lbl}</span></div>
                <div style="font-size:10px;color:var(--text2);margin-top:5px">Джерело: SaveEcoBot</div>
                </div>`, { maxWidth: 220 });
                S.radMarkers.push(mk);
            }
        }

        // ─── Grid сітка температури/вітру (4×5 = 20 точок) ────────────────────────
        const GRID_PTS = [];
        for (const lat of [50.30, 50.70, 51.10, 51.50]) for (const lng of [23.80, 24.30, 24.80, 25.30, 25.80]) GRID_PTS.push({ lat, lng });

        function windArrowHtml(spd, dir) {
            const col = spd < 3 ? '#34d399' : spd < 7 ? '#fbbf24' : spd < 12 ? '#f97316' : '#ef4444';
            return `<div class="wind-arrow"><svg width="20" height="20" viewBox="0 0 20 20" style="transform:rotate(${dir}deg)"><polygon points="10,2 14,16 10,13 6,16" fill="${col}"/></svg><span>${spd.toFixed(1)}</span></div>`;
        }

        function tempToColor(t) {
            if (t < 0) return '#1d4ed8'; if (t < 5) return '#0284c7'; if (t < 10) return '#0891b2';
            if (t < 15) return '#0d9488'; if (t < 20) return '#16a34a'; if (t < 25) return '#ca8a04';
            if (t < 30) return '#ea580c'; return '#dc2626';
        }

        async function fetchGridForecast() {
            return Promise.all(GRID_PTS.map(async pt => {
                try {
                    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pt.lat}&longitude=${pt.lng}&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Europe%2FKyiv`);
                    const d = await r.json(); const c = d.current || {};
                    return { ...pt, temp: c.temperature_2m, windSpeed: c.wind_speed_10m, windDir: c.wind_direction_10m };
                } catch { return { ...pt, temp: null, windSpeed: null, windDir: null } }
            }));
        }

        function buildTempLayer() {
            if (S.tempLayer) { map.removeLayer(S.tempLayer); S.tempLayer = null; }
            if (!S.layers.has('temp-grid') || !S.gridData.length) return;
            const layer = L.layerGroup();
            for (const pt of S.gridData) {
                if (pt.temp == null) continue;
                const col = tempToColor(pt.temp);
                const icon = L.divIcon({ className: '', html: `<div class="temp-chip" style="background:${col}">${pt.temp.toFixed(1)}°</div>`, iconSize: [46, 20], iconAnchor: [23, 10] });
                L.marker([pt.lat, pt.lng], { icon, interactive: false }).addTo(layer);
            }
            S.tempLayer = layer;
            S.tempLayer.addTo(map);
        }

        function buildWindLayer() {
            if (S.windLayer) { map.removeLayer(S.windLayer); S.windLayer = null; }
            if (!S.layers.has('wind-grid') || !S.gridData.length) return;
            const layer = L.layerGroup();
            for (const pt of S.gridData) {
                if (pt.windSpeed == null) continue;
                const icon = L.divIcon({ className: '', html: windArrowHtml(pt.windSpeed, pt.windDir), iconSize: [32, 32], iconAnchor: [16, 16] });
                L.marker([pt.lat, pt.lng], { icon }).bindTooltip(`${pt.windSpeed.toFixed(1)} м/с · ${pt.windDir}°`, { direction: 'top', offset: [0, -16] }).addTo(layer);
            }
            S.windLayer = layer;
            S.windLayer.addTo(map);
        }

        // EcoWitt — точка ЛНТУ на карті
        const EW_LAT = 50.7358, EW_LNG = 25.3247;
        function renderEWMarker() {
            if (S.ewMarker) { map.removeLayer(S.ewMarker); S.ewMarker = null; }
            if (!S.layers.has('ecowitt') || !S.ecowitt) return;
            const ew = S.ecowitt;
            const f = (v, dec = 1) => v != null ? v.toFixed(dec) : '—';
            const icon = L.divIcon({
                className: '',
                html: `<div style="background:#34d399;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 12px #34d399;display:flex;align-items:center;justify-content:center;font-size:9px">🌿</div>`,
                iconSize: [16, 16], iconAnchor: [8, 8]
            });
            const popup = `<div>
          <div class="ppt">🌿 EcoWitt — ЛНТУ</div>
          <div style="font-size:10px;color:var(--text2);margin-bottom:7px">Метеостанція Луцького НТУ</div>
          <div class="ppr"><span>🌡 Outdoor</span><span class="ppv">${f(ew.tempOut)}°C / ${f(ew.humOut, 0)}%</span></div>
          <div class="ppr"><span>🏠 Indoor</span><span class="ppv">${f(ew.tempIn)}°C / ${f(ew.humIn, 0)}%</span></div>
          <div class="ppr"><span>💨 Вітер</span><span class="ppv">${f(ew.windSpeed)} м/с (пор. ${f(ew.windGust)})</span></div>
          <div class="ppr"><span>🌡 Тиск</span><span class="ppv">${f(ew.pressureRel, 0)} гПа</span></div>
          <div class="ppr"><span>☀️ Сонце / УФ</span><span class="ppv">${f(ew.solar, 0)} Вт/м² · UVI ${f(ew.uvi, 0)}</span></div>
          <div class="ppr"><span>🌧 Опади</span><span class="ppv">${f(ew.rainDaily)} мм/добу</span></div>
          ${ew.soilMoisture != null ? `<div class="ppr"><span>🌱 Ґрунт</span><span class="ppv">${f(ew.soilMoisture, 0)}% вологість</span></div>` : ''}
          <div style="font-size:10px;color:var(--text2);margin-top:5px">Джерело: EcoWitt API</div>
        </div>`;
            S.ewMarker = L.marker([EW_LAT, EW_LNG], { icon }).addTo(map).bindPopup(popup, { maxWidth: 260 });
        }

        function renderMap() {
            S.markers.forEach(m => map.removeLayer(m));
            S.circles.forEach(c => map.removeLayer(c));
            S.markers = []; S.circles = [];

            if (S.regionLayer) {
                if (S.layers.has('region')) S.regionLayer.addTo(map);
                else map.removeLayer(S.regionLayer);
            }

            if (!S.layers.has('stations')) return;

            const ap = [...S.params][0] || 'pm25';

            for (const st of S.stations) {
                const v = st.data[ap] || 0, lim = PL[ap] || 50, col = aqiColor(v, lim);

                {
                    const c = L.circle([st.lat, st.lng], { radius: 9000, color: col, fillColor: col, fillOpacity: .12, weight: 0 }).addTo(map);
                    S.circles.push(c);
                }

                const icon = L.divIcon({ className: '', html: `<div style="background:${col};width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 8px ${col}"></div>`, iconSize: [13, 13], iconAnchor: [6, 6] });
                const mk = L.marker([st.lat, st.lng], { icon }).addTo(map).bindPopup(buildPopup(st), { maxWidth: 270 });
                S.markers.push(mk);
            }
        }

        function buildPopup(st) {
            const d = st.data;
            const srcLabel = st.iqSource ? '<span style="color:#e879f9;font-size:10px">● IQAir</span>' : st.sebSource ? '<span style="color:#34d399;font-size:10px">● SaveEcoBot</span>' : st.hasReal ? '<span style="color:#34d399;font-size:10px">● OpenAQ</span>' : '<span style="color:#f59e0b;font-size:10px">● Модель</span>';
            const fields = [
                ['PM2.5', d.pm25, 'мкг/м³', PL.pm25],
                ['PM10', d.pm10, 'мкг/м³', PL.pm10],
                ['AQI', d.aqi, '', PL.aqi],
            ].map(([k, v, u, lim]) => {
                if (v == null) return '';
                const [, cls] = aqiLabel(v, lim);
                return `<div class="ppr"><span>${k}</span><span class="ppv ${cls}">${+v.toFixed(1)}${u ? ' ' + u : ''}</span></div>`;
            }).join('');
            return `<div><div class="ppt">📍 ${st.name}</div>
    <div style="margin-bottom:7px;display:flex;justify-content:space-between">${srcLabel}<span style="font-size:10px;color:var(--text2)">${st.city}</span></div>
    ${fields}
    ${d.temp != null ? `<div class="ppr"><span>🌡 Температура</span><span class="ppv">${d.temp.toFixed(1)}°C</span></div>` : ''}
    ${d.humidity != null ? `<div class="ppr"><span>💧 Вологість</span><span class="ppv">${d.humidity.toFixed(0)}%</span></div>` : ''}
    ${d.wind_speed != null ? `<div class="ppr"><span>💨 Вітер</span><span class="ppv">${d.wind_speed.toFixed(1)} м/с</span></div>` : ''}
    ${d.pressure != null ? `<div class="ppr"><span>🌡 Тиск</span><span class="ppv">${d.pressure.toFixed(0)} гПа</span></div>` : ''}
    ${d.temp != null ? `<div style="font-size:10px;color:var(--text2);margin-top:5px">🌦 Погода: Open-Meteo</div>` : ''}
  </div>`;
        }

        // ═══════════════════════════════════════════════
        // BOTTOM PANELS
        // ═══════════════════════════════════════════════
        function renderAll() { renderSt(); renderWx(); renderIQ(); renderEW(); }

        function renderEW() {
            const el = document.getElementById('tab-ew');
            if (!el) return;
            const ew = S.ecowitt;
            if (!ew) {
                const hasKeys = CFG.ECOWITT_APP_KEY && CFG.ECOWITT_API_KEY && CFG.ECOWITT_MAC;
                el.innerHTML = `<div class="nd" style="text-align:left;padding:14px">
      <b style="color:var(--warn)">🌿 EcoWitt — метеостанція ЛНТУ</b><br><br>
      ${hasKeys ? '<b style="color:#ef4444">❌ Помилка підключення. Перевірте ключі.</b>' : '<b>Для підключення потрібні API ключі:</b>'}<br><br>
      1. Зайти на <a href="https://api.ecowitt.net" target="_blank" style="color:var(--accent)">api.ecowitt.net</a> → Developer<br>
      2. Create Application → отримати <code>application_key</code><br>
      3. Додати пристрій → отримати <code>api_key</code> та MAC<br>
      4. Вставити в CFG у коді або в <code>.env</code> файл<br><br>
      <span style="color:var(--text2);font-size:10px">Станція: ecowitt.net/home/index?id=65950</span>
    </div>`;
                return;
            }
            const f = (v, dec = 1) => v != null ? v.toFixed(dec) : '—';
            el.innerHTML = `
      <div class="dc"><div class="dct">🌡 Outdoor</div><div class="dcv" style="color:#60a5fa">${f(ew.tempOut)}<span class="dcu">°C</span></div><div class="dcs">${f(ew.humOut, 0)}% вологість</div></div>
      <div class="dc"><div class="dct">🏠 Indoor</div><div class="dcv" style="color:#34d399">${f(ew.tempIn)}<span class="dcu">°C</span></div><div class="dcs">${f(ew.humIn, 0)}% вологість</div></div>
      <div class="dc"><div class="dct">💨 Вітер</div><div class="dcv" style="color:#a78bfa">${f(ew.windSpeed)}<span class="dcu">м/с</span></div><div class="dcs">Пориви: ${f(ew.windGust)} м/с</div></div>
      <div class="dc"><div class="dct">🌡 Тиск</div><div class="dcv" style="color:#fb923c">${f(ew.pressureRel, 0)}<span class="dcu">гПа</span></div></div>
      <div class="dc"><div class="dct">☀️ Сонце / УФ</div><div class="dcv" style="color:#fbbf24">${f(ew.solar, 0)}<span class="dcu">Вт/м²</span></div><div class="dcs">UVI: ${f(ew.uvi, 0)}</div></div>
      <div class="dc"><div class="dct">🌧 Опади</div><div class="dcv" style="color:#60a5fa">${f(ew.rainDaily)}<span class="dcu">мм/добу</span></div><div class="dcs">${f(ew.rainRate)} мм/год</div></div>
      ${ew.soilTemp != null ? `<div class="dc"><div class="dct">🌱 Ґрунт CH1</div><div class="dcv" style="color:#84cc16">${f(ew.soilTemp)}<span class="dcu">°C</span></div><div class="dcs">Волога: ${f(ew.soilMoisture, 0)}%</div></div>` : ''}
      ${ew.tempCh7 != null ? `<div class="dc"><div class="dct">🌡 T&H CH7</div><div class="dcv" style="color:#34d399">${f(ew.tempCh7)}<span class="dcu">°C</span></div><div class="dcs">${f(ew.humCh7, 0)}%</div></div>` : ''}
      ${ew.leafWetness != null ? `<div class="dc"><div class="dct">🍃 Листок CH1</div><div class="dcv" style="color:#34d399">${f(ew.leafWetness, 0)}<span class="dcu">%</span></div></div>` : ''}`;
        }

        function renderAir() {
            const el = document.getElementById('tab-air');
            if (!S.stations.length) { el.innerHTML = '<div class="nd">Немає даних</div>'; return; }
            const ps = ['pm25', 'pm10', 'no2', 'o3', 'co', 'so2'];
            const avgs = {};
            for (const p of ps) { const vs = S.stations.map(s => s.data[p]).filter(v => v !== undefined); avgs[p] = vs.length ? vs.reduce((a, b) => a + b) / vs.length : 0; }
            const active = ps.filter(p => S.params.has(p));
            let cards = active.map(p => { const [lbl, cls] = aqiLabel(avgs[p], PL[p]); return `<div class="dc"><div class="dct">${PN[p]} (сер.)</div><div class="dcv" style="color:${PC[p]}">${avgs[p].toFixed(1)}<span class="dcu">мкг/м³</span></div><div class="dcs ${cls}">${lbl}</div></div>`; }).join('');
            const cid = 'ch-air';
            el.innerHTML = cards + `<div class="cw"><canvas id="${cid}"></canvas></div>`;
            if (S.charts[cid]) S.charts[cid].destroy();
            const hrs = Array.from({ length: 24 }, (_, i) => i);
            S.charts[cid] = new Chart(document.getElementById(cid).getContext('2d'), {
                type: 'line',
                data: {
                    labels: hrs.map(h => `${h}:00`), datasets: active.map(p => ({
                        label: PN[p], data: hrs.map(h => { const f = ((h >= 7 && h <= 9) || (h >= 17 && h <= 19)) ? 1.4 : (h <= 5 ? .5 : 1); return +(avgs[p] * f * (0.8 + Math.random() * .4)).toFixed(1); }),
                        borderColor: PC[p], backgroundColor: PC[p] + '1a', tension: .4, fill: false, pointRadius: 1, borderWidth: 2
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#8b98b0', font: { size: 10 }, boxWidth: 10 } } },
                    scales: { x: { ticks: { color: '#4a5568', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1a2030' } }, y: { ticks: { color: '#4a5568', font: { size: 9 } }, grid: { color: '#1a2030' } } }
                }
            });
        }

        function renderSt() {
            const el = document.getElementById('tab-st');
            if (!S.stations.length) { el.innerHTML = '<div class="nd">Немає даних</div>'; return; }
            const rows = S.stations.map(st => {
                const d = st.data;
                const pm25 = d.pm25 ?? null, pm10 = d.pm10 ?? null, aqi = d.aqi ?? null;
                const [lbl, cls] = aqiLabel(pm25 ?? 0, PL.pm25);
                const src = st.iqSource ? { l: 'IQAir', c: '#e879f9' } : st.sebSource ? { l: 'SaveEcoBot', c: '#34d399' } : { l: 'OpenAQ', c: '#34d399' };
                const fv = (v, unit, col) => v != null ? `<b style="color:${col}">${v.toFixed(1)}</b><span style="color:var(--text2);font-size:9px"> ${unit}</span>` : '<span style="color:var(--text2)">—</span>';
                return `<div class="sr" style="grid-template-columns:1fr auto auto auto auto auto">
      <div><div class="sn">${st.name}</div><div class="sloc">${st.city}</div></div>
      <div style="font-size:11px;text-align:right">PM2.5&nbsp;${fv(pm25, 'мкг/м³', PC.pm25)}</div>
      <div style="font-size:11px;text-align:right">PM10&nbsp;${fv(pm10, 'мкг/м³', PC.pm10)}</div>
      <div style="font-size:11px;text-align:right">AQI&nbsp;${aqi != null ? `<b style="color:#e879f9">${Math.round(aqi)}</b>` : '<span style="color:var(--text2)">—</span>'}</div>
      <div class="pill ${cls}">${lbl}</div>
      <div class="pill" style="background:${src.c}1a;color:${src.c}">${src.l}</div>
    </div>`;
            }).join('');
            el.innerHTML = `<div class="sl">${rows}</div>`;
        }

        function renderWx() {
            const el = document.getElementById('tab-wx');
            const sts = S.stations.filter(s => s.wx?.current);
            if (!sts.length) { el.innerHTML = '<div class="nd">Метеодані недоступні</div>'; return; }
            const wc = { 0: '☀️', 1: '🌤', 2: '⛅', 3: '☁️', 45: '🌫', 51: '🌦', 61: '🌧', 71: '🌨', 80: '🌦', 95: '⛈' };
            const src = `<div style="font-size:10px;color:var(--text2);padding:2px 0 8px;width:100%">📡 <b>Open-Meteo</b> — поточна погода для кожної станції</div>`;
            const stCards = sts.map(st => {
                const c = st.wx.current;
                const ico = wc[c.weather_code] || '🌡';
                return `<div class="dc" style="min-width:140px">
              <div class="dct">${ico} ${st.name}</div>
              <div class="dcv" style="color:#60a5fa;font-size:18px">${c.temperature_2m?.toFixed(1)}<span class="dcu">°C</span></div>
              <div class="dcs">${c.relative_humidity_2m}% вол.</div>
              <div style="font-size:10px;color:var(--text2);margin-top:3px">💨 ${c.wind_speed_10m?.toFixed(1)} м/с · ${c.surface_pressure?.toFixed(0)} гПа</div>
            </div>`;
            }).join('');
            // Графік для першої станції
            const first = sts[0];
            const cid = 'ch-wx';
            el.innerHTML = src + stCards + `<div class="cw" style="min-width:260px"><canvas id="${cid}"></canvas></div>`;
            if (S.charts[cid]) S.charts[cid].destroy();
            const hrs = first.wx.hourly?.time?.map(t => t.slice(11, 16)) || [];
            S.charts[cid] = new Chart(document.getElementById(cid).getContext('2d'), {
                type: 'line',
                data: {
                    labels: hrs, datasets: sts.map((st, i) => ({
                        label: `${st.name.split(' ')[0]} °C`,
                        data: st.wx.hourly?.temperature_2m || [],
                        borderColor: ['#60a5fa', '#34d399', '#a78bfa', '#fb923c'][i % 4],
                        tension: .4, fill: false, pointRadius: 0, borderWidth: 2, yAxisID: 'y'
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#8b98b0', font: { size: 10 }, boxWidth: 10 } } },
                    scales: {
                        x: { ticks: { color: '#4a5568', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1a2030' } },
                        y: { ticks: { color: '#60a5fa', font: { size: 9 } }, grid: { color: '#1a2030' } }
                    }
                }
            });
        }

        function renderIQ() {
            const el = document.getElementById('tab-iq');
            const iq = S.iqair;
            if (!iq) {
                el.innerHTML = `<div class="nd" style="text-align:left;padding:14px">
      <b style="color:var(--warn)">⚠️ IQAir API не підключено</b><br><br>
      <b>Що дає IQAir API:</b><br>
      • AQI індекс в реальному часі (US та CN стандарти)<br>
      • PM2.5, PM10 концентрація<br>
      • Основний забруднювач дня<br>
      • Погода: температура, вологість, тиск, вітер<br>
      • Рекомендації для здоров'я<br><br>
      <b>Як підключити:</b><br>
      1. Зайти на <a href="https://www.iqair.com/dashboard/api" target="_blank" style="color:var(--accent)">iqair.com/dashboard/api</a><br>
      2. Зареєструватись → Free план (10k запитів/міс)<br>
      3. Скопіювати API Key<br>
      4. У коді змінити: <code style="color:var(--warn)">CFG.IQAIR_KEY = 'ВАШ_КЛЮЧ'</code>
    </div>`;
                return;
            }
            const p = iq.current?.pollution, w2 = iq.current?.weather;
            const main = p?.mainus || '—';
            const aqiVal = p?.aqius || 0;
            const [lbl, cls] = aqiLabel(aqiVal, 100);
            el.innerHTML = `
    <div class="dc"><div class="dct">AQI (US)</div><div class="dcv" style="color:#e879f9">${aqiVal}</div><div class="dcs ${cls}">${lbl}</div></div>
    <div class="dc"><div class="dct">PM2.5</div><div class="dcv" style="color:${PC.pm25}">${p?.p2?.conc?.toFixed(1) || '—'}<span class="dcu">мкг/м³</span></div></div>
    <div class="dc"><div class="dct">Головний забруднювач</div><div class="dcv" style="font-size:14px;color:var(--warn)">${main}</div></div>
    <div class="dc"><div class="dct">Темп / Вологість</div><div class="dcv" style="font-size:14px;color:#60a5fa">${w2?.tp || '—'}°C / ${w2?.hu || '—'}%</div></div>
    <div class="dc"><div class="dct">Вітер IQAir</div><div class="dcv" style="font-size:14px;color:#a78bfa">${w2?.ws?.toFixed(1) || '—'}<span class="dcu">м/с</span></div></div>
    <div class="dc"><div class="dct">Місто / Країна</div><div class="dcv" style="font-size:13px">${iq.city || '—'}</div><div class="dcs">${iq.country || 'UA'}</div></div>`;
        }

        // ═══════════════════════════════════════════════
        // UI EVENTS
        // ═══════════════════════════════════════════════
        function swTab(name, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.pc').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        document.querySelectorAll('#fg .fi').forEach(fi => {
            fi.addEventListener('click', () => {
                const cb = fi.querySelector('input'); cb.checked = !cb.checked; fi.classList.toggle('active', cb.checked);
                const p = fi.dataset.p; if (p) { cb.checked ? S.params.add(p) : S.params.delete(p); }
                renderMap(); renderAll();
            });
        });
        document.querySelectorAll('#lg .fi').forEach(fi => {
            fi.addEventListener('click', () => {
                const cb = fi.querySelector('input'); cb.checked = !cb.checked; fi.classList.toggle('active', cb.checked);
                const l = fi.dataset.l; if (l) { cb.checked ? S.layers.add(l) : S.layers.delete(l); }
                renderMap();
                renderRadiation();
                renderEWMarker();
                buildTempLayer(); buildWindLayer();
            });
        });

        function showLoad(v) { document.getElementById('lov').classList.toggle('show', v); }

        function exportCSV() {
            const h = ['Станція', 'Місто', 'Джерело', 'PM2.5', 'PM10', 'AQI', 'Температура', 'Вологість', 'Тиск', 'Вітер'];
            const rows = S.stations.map(s => {
                const d = s.data; const src = s.iqSource ? 'IQAir' : s.sebSource ? 'SaveEcoBot' : 'OpenAQ';
                return [s.name, s.city || '', src, d.pm25?.toFixed(2) || '', d.pm10?.toFixed(2) || '', d.aqi?.toFixed(0) || '', d.temp?.toFixed(1) || '', d.humidity?.toFixed(0) || '', d.pressure?.toFixed(1) || '', d.wind_speed?.toFixed(1) || ''];
            });
            const csv = [h, ...rows].map(r => r.join(',')).join('\n');
            const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
            a.download = `lntu-eco-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
        }

        // Завантажуємо конфіг з сервера, потім дані
        fetch('/api/config').then(r => r.json()).then(d => { Object.assign(CFG, d); loadAll(); }).catch(() => loadAll());
    </script>
</body>

</html>
