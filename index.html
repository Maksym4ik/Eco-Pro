<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoScanHub — Волинська область</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1e2533;
            --border: #2a3040;
            --accent: #4f8ef7;
            --accent2: #34d399;
            --warn: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text2: #8b98b0;
            --radius: 10px;
            --sidebar: 280px
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            flex-shrink: 0
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -.5px
        }

        .logo span {
            color: var(--accent2)
        }

        .sdot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent2);
            box-shadow: 0 0 6px var(--accent2);
            animation: pulse 2s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .stext {
            font-size: 12px;
            color: var(--text2)
        }

        .lupd {
            margin-left: auto;
            font-size: 11px;
            color: var(--text2)
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden
        }

        .sidebar {
            width: var(--sidebar);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0
        }

        .ss {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border)
        }

        .st {
            font-size: 10px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 9px
        }

        .fg {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .fi {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 7px;
            border-radius: 6px;
            cursor: pointer;
            transition: background .15s;
            user-select: none
        }

        .fi:hover {
            background: var(--surface2)
        }

        .fi input {
            display: none
        }

        .fd {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .fl {
            font-size: 12px;
            flex: 1
        }

        .fb {
            font-size: 10px;
            background: var(--surface2);
            padding: 1px 5px;
            border-radius: 8px;
            color: var(--text2)
        }

        .fi.active .fl {
            color: var(--text);
            font-weight: 500
        }

        .fi:not(.active) {
            opacity: .45
        }

        .di {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 12px
        }

        .tw {
            margin-top: 9px
        }

        .tl {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .tv {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin-bottom: 5px
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer
        }

        .li {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .lc {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0
        }

        .btn {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .15s
        }

        .bp {
            background: var(--accent);
            color: #fff
        }

        .bp:hover {
            opacity: .85
        }

        .bs {
            background: var(--surface2);
            color: var(--text);
            margin-top: 5px;
            border: 1px solid var(--border)
        }

        .mw {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        #map {
            flex: 1
        }

        .bp2 {
            background: var(--surface);
            border-top: 1px solid var(--border);
            height: 260px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0
        }

        .pt {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .tab {
            padding: 9px 16px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text2);
            border-bottom: 2px solid transparent;
            transition: all .15s
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .pc {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start
        }

        .pc.active {
            display: flex
        }

        .dc {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            min-width: 130px;
            flex: 1
        }

        .dct {
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 3px
        }

        .dcv {
            font-size: 20px;
            font-weight: 700
        }

        .dcu {
            font-size: 10px;
            color: var(--text2);
            margin-left: 3px
        }

        .dcs {
            font-size: 10px;
            margin-top: 3px;
            padding: 2px 7px;
            border-radius: 8px;
            display: inline-block
        }

        .good {
            color: #34d399;
            background: rgba(52, 211, 153, .12)
        }

        .moderate {
            color: #f59e0b;
            background: rgba(245, 158, 11, .12)
        }

        .poor {
            color: #ef4444;
            background: rgba(239, 68, 68, .12)
        }

        .cw {
            flex: 2;
            min-width: 260px;
            height: 200px;
            position: relative
        }

        .sl {
            width: 100%;
            font-size: 12px
        }

        .sr {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 10px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border)
        }

        .sr:last-child {
            border: none
        }

        .sn {
            font-weight: 500;
            font-size: 12px
        }

        .sloc {
            font-size: 10px;
            color: var(--text2)
        }

        .pill {
            padding: 2px 7px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600
        }

        .nd {
            color: var(--text2);
            font-size: 12px;
            padding: 16px;
            text-align: center;
            width: 100%
        }

        .apik {
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .3);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--warn);
            margin-top: 8px;
            line-height: 1.5
        }

        .apik a {
            color: var(--accent);
            text-decoration: none
        }

        ::-webkit-scrollbar {
            width: 4px
        }

        ::-webkit-scrollbar-track {
            background: var(--surface)
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px
        }

        #tip-box {
            position: fixed;
            background: #1e2533;
            border: 1px solid #2a3040;
            color: #e2e8f0;
            font-size: 11px;
            padding: 7px 10px;
            border-radius: 8px;
            white-space: normal;
            width: 220px;
            z-index: 99999;
            line-height: 1.45;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .6)
        }

        .temp-chip {
            background: #1d4ed8;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .5);
            letter-spacing: -0.3px
        }

        .wind-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 9px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8)
        }

        .wind-arrow svg {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6))
        }

        .leaflet-popup-content-wrapper {
            background: var(--surface) !important;
            border: 1px solid var(--border) !important;
            color: var(--text) !important;
            border-radius: var(--radius) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6) !important
        }

        .leaflet-popup-tip {
            background: var(--surface) !important
        }

        .ppt {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 7px;
            color: var(--accent)
        }

        .ppr {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            font-size: 11px;
            padding: 3px 0;
            border-bottom: 1px solid var(--border)
        }

        .ppr:last-child {
            border: none
        }

        .ppv {
            font-weight: 600
        }

        #lov {
            position: absolute;
            top: 50%;
            left: calc(var(--sidebar) + 50%);
            transform: translate(-50%, -50%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 26px;
            text-align: center;
            z-index: 9999;
            display: none
        }

        #lov.show {
            display: block
        }

        .sp {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ── Аналітика ──────────────────────────────── */
        #an-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 5000;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .an-topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .an-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap
        }

        .an-period-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap
        }

        .an-pbtn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: .15s
        }

        .an-pbtn:hover,
        .an-pbtn.active {
            border-color: var(--accent);
            color: var(--accent)
        }

        .an-psep {
            color: var(--border);
            font-size: 12px
        }

        .an-date-in {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 12px;
            outline: none;
            cursor: pointer
        }

        .an-date-in:focus {
            border-color: var(--accent)
        }

        .an-close-btn {
            margin-left: auto;
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: .15s
        }

        .an-close-btn:hover {
            border-color: var(--danger);
            color: var(--danger)
        }

        .an-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .an-body-inner {
            max-width: 1280px;
            margin: 0 auto
        }

        /* Summary */
        .an-summary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 22px
        }

        .an-scard {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 12px;
            text-align: center
        }

        .an-sval {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 4px
        }

        .an-slbl {
            font-size: 11px;
            color: var(--text2)
        }

        .an-sunit {
            font-size: 10px;
            color: var(--text2);
            margin-top: 2px
        }

        /* Station card */
        .an-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 14px
        }

        .an-card-hdr {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px
        }

        .an-card-name {
            font-size: 14px;
            font-weight: 600
        }

        .an-card-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 2px
        }

        .an-src {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text2);
            margin-left: auto;
            white-space: nowrap
        }

        .an-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        @media (max-width: 900px) {
            .an-grid {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .an-cw {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px
        }

        .an-cw-hdr {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px
        }

        .an-cw-lbl {
            font-size: 11px;
            color: var(--text2)
        }

        .an-cw-avg {
            font-size: 14px;
            font-weight: 700
        }

        .an-canvas-wrap {
            position: relative;
            height: 130px
        }

        .an-nodata {
            text-align: center;
            padding: 48px 20px;
            color: var(--text2);
            font-size: 14px;
            line-height: 1.8
        }

        /* Tabs */
        .an-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            flex-wrap: wrap
        }

        .an-tab {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 12px;
            cursor: pointer;
            transition: .15s;
            white-space: nowrap
        }

        .an-tab:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .an-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600
        }

        /* Stats row under chart label */
        .an-stats-row {
            display: flex;
            gap: 10px;
            font-size: 10px;
            color: var(--text2);
            margin-bottom: 5px;
            flex-wrap: wrap
        }

        .an-stats-row b {
            font-weight: 700
        }

        /* PDF export button */
        .an-export-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: .15s
        }

        .an-export-btn:hover {
            border-color: #22c55e;
            color: #22c55e
        }

        /* Print styles */
        @media print {
            body>*:not(#an-panel) {
                display: none !important
            }

            #an-panel {
                position: static !important;
                display: flex !important;
                height: auto !important;
                overflow: visible !important
            }

            .an-topbar {
                display: none !important
            }

            .an-body {
                overflow: visible !important;
                padding: 10px !important
            }

            .an-canvas-wrap {
                height: 180px !important
            }

            .an-tabs {
                display: none !important
            }

            .an-tab-content {
                display: block !important
            }

            #an-tab-air,
            #an-tab-weather,
            #an-tab-radiation {
                display: block !important
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important
            }
        }

        /* ── Архівний режим ─────────────────────────── */
        .arch-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: border-color .2s, color .2s
        }

        .arch-btn:hover {
            color: var(--text);
            border-color: var(--accent)
        }

        .arch-btn.active {
            border-color: var(--warn);
            color: var(--warn)
        }

        .arch-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--warn);
            border-radius: 8px;
            padding: 4px 10px;
            animation: fadein .2s
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateX(-6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .arch-controls label {
            font-size: 11px;
            color: var(--text2)
        }

        .arch-controls input[type=date],
        .arch-controls select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 12px;
            cursor: pointer;
            outline: none
        }

        .arch-controls input[type=date]:focus,
        .arch-controls select:focus {
            border-color: var(--accent)
        }

        /* Phosphor icons glow */
        .ph-duotone { vertical-align: -0.15em; line-height: 1 }
        .ico-green  { color: #34d399; filter: drop-shadow(0 0 5px #34d399aa) }
        .ico-blue   { color: #60a5fa; filter: drop-shadow(0 0 5px #60a5faaa) }
        .ico-purple { color: #a78bfa; filter: drop-shadow(0 0 5px #a78bfaaa) }
        .ico-warn   { color: #fbbf24; filter: drop-shadow(0 0 5px #fbbf24aa) }
        .ico-accent { color: #4f8ef7; filter: drop-shadow(0 0 5px #4f8ef7aa) }
        .ico-rad    { color: #f87171; filter: drop-shadow(0 0 6px #f87171cc) }
        .ico-muted  { color: var(--text2) }

        /* Panel toggle buttons */
        .panel-toggle-btn {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text2); cursor: pointer; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: color .2s, border-color .2s; flex-shrink: 0;
        }
        .panel-toggle-btn:hover { color: var(--accent); border-color: var(--accent) }
        .sidebar-toggle-btn { width: 24px; height: 100%; border-radius: 0; border-top: none; border-bottom: none; border-left: none; writing-mode: vertical-rl; font-size: 14px }
        .bottom-toggle-btn { width: 100%; height: 20px; border-radius: 4px 4px 0 0; border-bottom: none; font-size: 12px }
        .sidebar.hidden { display: none }
        .bottom-panel-hidden #bottom-panel { display: none }
        .bottom-panel-hidden #bottom-toggle i { transform: rotate(180deg) }

        .arch-load-btn {
            background: var(--warn);
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer
        }

        .arch-load-btn:hover {
            opacity: .85
        }

        .arch-badge {
            background: var(--warn);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            border-radius: 4px;
            padding: 2px 5px;
            letter-spacing: .5px
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">EcoScan<span>Hub</span></div>
        <div class="sdot" id="sdot"></div>
        <div class="stext" id="stxt">Завантаження...</div>
        <div class="lupd" id="lupd"></div>
        <button id="btn-refresh" onclick="loadAll()" title="Оновити дані"

    <script>

        const CFG = { IQAIR_KEY: '', ECOWITT_APP_KEY: '', ECOWITT_API_KEY: '', ECOWITT_MAC: '' };

        // ═══════════════════════════════════════════════
        // STATE

            charts: {}
        };

        // ═══════════════════════════════════════════════
        // VOLYN GeoJSON — повний контур з OSM-даних
        // ═══════════════════════════════════════════════
        const VOLYN = {
            "type": "FeatureCollection", "features": [{
                "type": "Feature", "properties": { "name": "Волинська область" }, "geometry": {
                    "type": "Polygon", "coordinates": [[
                        [23.530, 51.627], [23.580, 51.640], [23.650, 51.648], [23.710, 51.660], [23.790, 51.652], [23.850, 51.647], [23.920, 51.655], [24.000, 51.660], [24.080, 51.650], [24.150, 51.643], [24.230, 51.635], [24.310, 51.628], [24.390, 51.638], [24.470, 51.643], [24.550, 51.635], [24.630, 51.628], [24.710, 51.618], [24.790, 51.625], [24.870, 51.635], [24.950, 51.628], [25.040, 51.618], [25.120, 51.610], [25.200, 51.618], [25.290, 51.610], [25.370, 51.600], [25.450, 51.608], [25.530, 51.598], [25.620, 51.590], [25.710, 51.575], [25.820, 51.562], [25.920, 51.548], [26.000, 51.535], [26.030, 51.515], [26.010, 51.492], [25.980, 51.468], [25.970, 51.440], [25.990, 51.415], [26.010, 51.388], [26.000, 51.360], [25.970, 51.332], [25.940, 51.305], [25.960, 51.278], [25.980, 51.250], [25.960, 51.222], [25.920, 51.195], [25.890, 51.168], [25.860, 51.140], [25.830, 51.112], [25.800, 51.085], [25.760, 51.058], [25.720, 51.030], [25.680, 51.003], [25.630, 50.978], [25.580, 50.952], [25.530, 50.928], [25.470, 50.905], [25.410, 50.882], [25.350, 50.860], [25.290, 50.840], [25.220, 50.820], [25.160, 50.800], [25.090, 50.782], [25.020, 50.765], [24.950, 50.748], [24.870, 50.733], [24.790, 50.720], [24.710, 50.708], [24.630, 50.698], [24.540, 50.688], [24.460, 50.672], [24.380, 50.658], [24.300, 50.645], [24.210, 50.630], [24.120, 50.618], [24.040, 50.608], [23.960, 50.600], [23.870, 50.592], [23.790, 50.588], [23.700, 50.590], [23.620, 50.595], [23.550, 50.605], [23.490, 50.620], [23.450, 50.640], [23.420, 50.668], [23.408, 50.700], [23.400, 50.732], [23.395, 50.765], [23.395, 50.798], [23.398, 50.832], [23.402, 50.865], [23.410, 50.898], [23.418, 50.930], [23.428, 50.963], [23.440, 50.995], [23.453, 51.028], [23.465, 51.060], [23.473, 51.092], [23.478, 51.125], [23.480, 51.158], [23.482, 51.190], [23.488, 51.222], [23.495, 51.255], [23.500, 51.288], [23.503, 51.320], [23.505, 51.352], [23.508, 51.385], [23.510, 51.417], [23.513, 51.450], [23.518, 51.482], [23.523, 51.515], [23.527, 51.548], [23.530, 51.580], [23.530, 51.627]
                    ]]
                }
            }]
        };

        // Відомі станції Волині
        const KNOWN = [
            { name: 'Луцьк — Центр', lat: 50.7472, lng: 25.3254, city: 'Луцьк' },
            { name: 'Луцьк — Вокзал', lat: 50.7280, lng: 25.3220, city: 'Луцьк' },
            { name: 'Луцьк — Промзона', lat: 50.7600, lng: 25.3800, city: 'Луцьк' },
            { name: 'Луцьк — Теремно', lat: 50.7750, lng: 25.3600, city: 'Луцьк' },
            { name: 'Ковель', lat: 51.2108, lng: 24.7068, city: 'Ковель' },
            { name: 'Нововолинськ', lat: 51.2320, lng: 24.1600, city: 'Нovovolynsk' },
            { name: 'Володимир', lat: 50.8480, lng: 24.3230, city: 'Володимир' },
            { name: 'Рожище', lat: 50.9140, lng: 25.2720, city: 'Рожище' },
            { name: 'Горохів', lat: 50.5010, lng: 24.7780, city: 'Горохів' },
            { name: 'Камінь-Каширський', lat: 51.6250, lng: 24.9960, city: 'Камінь-Каширський' },
            { name: 'Ківерці', lat: 50.6960, lng: 25.4610, city: 'Ківерці' },
            { name: 'Локачі', lat: 50.7390, lng: 24.6280, city: 'Локачі' },
        ];

        const PC = { pm25: '#ef4444', pm10: '#f59e0b', aqi: '#e879f9', temp: '#60a5fa', humidity: '#34d399', wind_speed: '#a78bfa', pressure: '#fb923c' };
        const PL = { pm25: 25, pm10: 50, aqi: 100, temp: 35, humidity: 85, wind_speed: 15, pressure: 1025 };
        const PN = { pm25: 'PM2.5', pm10: 'PM10', aqi: 'AQI', temp: 'Температура', humidity: 'Вологість', wind_speed: 'Вітер', pressure: 'Тиск' };

        function aqiColor(v, lim) { const r = v / lim; if (r < .5) return '#34d399'; if (r < 1) return '#fbbf24'; if (r < 1.5) return '#f97316'; if (r < 2) return '#ef4444'; return '#7c3aed' }
        function aqiLabel(v, lim) { const r = v / lim; if (r < .5) return ['Добра', 'good']; if (r < 1) return ['Помірна', 'moderate']; return ['Погана', 'poor'] }
        function rnd(a, b) { return +(Math.random() * (b - a) + a).toFixed(2) }

        function simData(st) {
            const h = S.hour, tf = ((h >= 7 && h <= 9) || (h >= 17 && h <= 19)) ? 1.45 : 1, nf = (h >= 1 && h <= 5) ? .5 : 1, f = tf * nf;
            const pm25 = rnd(5 * f, 30 * f), pm10 = rnd(pm25 * 1.3, pm25 * 2.2);
            const aqi = Math.round(pm25 < 12 ? pm25 * 4.2 : pm25 < 35.4 ? 50 + (pm25 - 12) * 2.1 : 100 + (pm25 - 35.4) * 1.5);
            return {
                pm25, pm10, no2: rnd(4 * f, 40 * f), o3: rnd(20 / f, 85 / f), co: rnd(180 * f, 1100 * f), so2: rnd(.5, 12 * f),
                temp: rnd(-3, 24), humidity: rnd(42, 88), pressure: rnd(1000, 1025), wind_speed: rnd(.5, 7), aqi, source: 'sim'
            };
        }

        // Point-in-polygon (ray-casting). poly = масив [lng, lat] пар (GeoJSON)
        function pip(lat, lng, poly) { let ins = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) ins = !ins; } return ins; }
        // Перевірка з пріоритетом точного полігону OSM, fallback на спрощений VOLYN
        function inRegion(lat, lng) {
            const polys = S.volynPoly || (VOLYN.features[0].geometry.coordinates);
            return polys.some(p => pip(lat, lng, p));
        }

        function radColor(v) {
            if (v < 0.10) return '#34d399';
            if (v < 0.30) return '#fbbf24';
            if (v < 1.00) return '#f97316';
            return '#ef4444';
        }
        function radLabel(v) {
            if (v < 0.10) return ['Норма', 'good'];
            if (v < 0.30) return ['Підвищений', 'moderate'];
            return ['Небезпечний', 'poor'];
        }

        async function fetchSaveecobot() {
            try {
                // Публічний файл даних Saveecobot (всі датчики)
                const r = await fetch('/proxy/saveecobot-maps/maps_data.js', {
                    headers: { Accept: 'application/json', 'Referer': 'https://www.saveecobot.com/' }
                });
                if (!r.ok) return { radiation: [], air: [] };
                const d = await r.json();
                const all = d.devices || [];

                const inVolyn = s => {
                    const lat = parseFloat(s.a), lng = parseFloat(s.n);
                    return !isNaN(lat) && !isNaN(lng) && inRegion(lat, lng);
                };
                const volyn = all.filter(inVolyn);

                // Радіаційні датчики (gamma в нСв/год)
                const radiation = volyn
                    .filter(s => s.gamma != null)
                    .map(s => ({
                        id: s.i, lat: parseFloat(s.a), lng: parseFloat(s.n),
                        value: parseFloat(s.gamma) / 1000,  // нСв/год → мкСв/год
                        valueRaw: s.gamma, unit: 'мкЗв/год',
                        old: s.oldr === 1, source: 'saveecobot',
                    }));

                // Датчики якості повітря (PM2.5, AQI)
                const air = volyn
                    .filter(s => s.pm25 != null && s.old === 0)
                    .map(s => ({
                        id: s.i, lat: parseFloat(s.a), lng: parseFloat(s.n),
                        pm25: parseFloat(s.pm25), aqi: s.aqi,
                        pm10: s.pm10 != null ? parseFloat(s.pm10) : null,
                        source: 'saveecobot', name: `SEB-${s.i}`, city: '',
                    }));

                return { radiation, air };
            } catch { return { radiation: [], air: [] } }
        }

        async function fetchEcoWitt() {
            if (!CFG.ECOWITT_APP_KEY || !CFG.ECOWITT_API_KEY || !CFG.ECOWITT_MAC) return null;
            try {
                const u = new URL('https://api.ecowitt.net/api/v3/device/real_time');
                u.searchParams.set('application_key', CFG.ECOWITT_APP_KEY);
                u.searchParams.set('api_key', CFG.ECOWITT_API_KEY);
                u.searchParams.set('mac', CFG.ECOWITT_MAC);
                u.searchParams.set('call_back', 'all');
                u.searchParams.set('temp_unitid', '1');
                u.searchParams.set('pressure_unitid', '5');
                u.searchParams.set('wind_speed_unitid', '7');
                u.searchParams.set('rainfall_unitid', '12');
                u.searchParams.set('solar_irradiance_unitid', '16');
                const r = await fetch(u);
                const d = await r.json();
                if (d.code !== 0) return null;
                const o = d.data || {};
                const fv = (obj, k) => obj?.[k]?.value !== undefined ? parseFloat(obj[k].value) : null;
                return {
                    tempOut: fv(o.outdoor, 'temperature'), humOut: fv(o.outdoor, 'humidity'),
                    dewPoint: fv(o.outdoor, 'dew_point'), feelsLike: fv(o.outdoor, 'feels_like'),
                    tempIn: fv(o.indoor, 'temperature'), humIn: fv(o.indoor, 'humidity'),
                    windSpeed: fv(o.wind, 'wind_speed'), windGust: fv(o.wind, 'wind_gust'),
                    windDir: fv(o.wind, 'wind_direction'),
                    pressureRel: fv(o.pressure, 'relative'), pressureAbs: fv(o.pressure, 'absolute'),
                    solar: fv(o.solar_and_uvi, 'solar'), uvi: fv(o.solar_and_uvi, 'uvi'),
                    rainRate: fv(o.rainfall, 'rain_rate'), rainDaily: fv(o.rainfall, 'daily'),
                    soilTemp: fv(o.soil_ch1, 'soiltemp'), soilMoisture: fv(o.soil_ch1, 'soilmoisture'),
                    leafWetness: fv(o.leaf_ch1, 'leaf_wetness'),
                    tempCh7: fv(o.temp_and_humidity_ch7, 'temperature'),
                    humCh7: fv(o.temp_and_humidity_ch7, 'humidity'),
                };
            } catch { return null }
        }

        // ═══════════════════════════════════════════════
        // MAP INIT
        // ═══════════════════════════════════════════════
        const map = L.map('map', { center: [50.95, 25.0], zoom: 9 });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Region border — fallback polygon, буде замінено точним контуром з OSM
        const REGION_STYLE = { color: '#4f8ef7', weight: 2, fillColor: '#4f8ef7', fillOpacity: .06, dashArray: '6,4' };
        S.regionLayer = L.geoJSON(VOLYN, { style: REGION_STYLE }).addTo(map);
        map.setView([51.13, 25.0], 8);

        // Асинхронно підвантажуємо точний контур Волинської обл. з OSM (R71064)
        fetch('https://nominatim.openstreetmap.org/lookup?osm_ids=R71064&format=geojson&polygon_geojson=1')
            .then(r => r.json())
            .then(geojson => {
                if (!geojson?.features?.length) return;
                map.removeLayer(S.regionLayer);
                S.regionLayer = L.geoJSON(geojson, { style: REGION_STYLE }).addTo(map);
                // Зберігаємо точний полігон для point-in-polygon фільтрації
                const geo = geojson.features[0].geometry;
                if (geo.type === 'Polygon') S.volynPoly = geo.coordinates;
                else if (geo.type === 'MultiPolygon') S.volynPoly = geo.coordinates.flat(1);
                // Перефільтровуємо радіацію точним контуром і перемальовуємо
                if (S.volynPoly && S.radiation.length) {
                    const before = S.radiation.length;
                    S.radiation = S.radiation.filter(s => inRegion(s.lat, s.lng));
                    if (S.radiation.length !== before) {
                        renderRadiation();
                    }
                }
            })
            .catch(() => { });

        // ═══════════════════════════════════════════════
        // API CALLS
        // ═══════════════════════════════════════════════
        async function fetchWeather(lat = 50.7472, lng = 25.3254) {
            try {
                const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,surface_pressure,weather_code&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&forecast_days=1&timezone=Europe%2FKyiv`;
                const r = await fetch(u); return await r.json();
            } catch { return null }
        }

        async function fetchIQAir() {
            if (!CFG.IQAIR_KEY) return null;
            // IQAir Nearest City endpoint
            try {
                const u = `https://api.airvisual.com/v2/nearest_city?lat=50.7472&lon=25.3254&key=${CFG.IQAIR_KEY}`;
                const r = await fetch(u);
                if (!r.ok) return null;
                const d = await r.json();
                return d.data || null;
            } catch { return null }
        }

        // ═══════════════════════════════════════════════
        // MAIN LOADER
        // ═══════════════════════════════════════════════
        async function loadAll() {
            showLoad(true);
            document.getElementById('stxt').textContent = 'Отримання даних...';

            const [wx, iq, rad, ew] = await Promise.all([
                fetchWeather(), fetchIQAir(),
                fetchSaveecobot(), fetchEcoWitt(),
            ]);

            // Відстань між двома точками (км)
            const km = (a, b) => { const R = 6371, p = Math.PI / 180, dl = (b.lat - a.lat) * p, dn = (b.lng - a.lng) * p; return R * 2 * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(a.lat * p) * Math.cos(b.lat * p) * Math.sin(dn / 2) ** 2)); };

            // Будуємо список лише з реальних джерел
            const realSt = [];

            // 1. SaveEcoBot — датчики якості повітря
            const usedNames = new Set();
            for (const air of (rad.air || [])) {
                let near = KNOWN[0], nearD = Infinity;
                for (const k of KNOWN) { const d = km(k, air); if (d < nearD) { nearD = d; near = k; } }
                const baseName = nearD < 8 ? near.name : `SaveEcoBot #${air.id}`;
                const name = usedNames.has(baseName) ? `${baseName} #${air.id}` : baseName;
                usedNames.add(name);
                realSt.push({
                    name, lat: air.lat, lng: air.lng,
                    city: nearD < 20 ? near.city : 'Волинська обл.',
                    data: { pm25: air.pm25, aqi: air.aqi || null, pm10: air.pm10 || null, source: 'saveecobot' },
                    hasReal: true, sebSource: true
                });
            }

            // 2. IQAir — Луцьк-центр (якщо ще немає поблизу)
            if (iq) {
                const lutsk = { name: 'Луцьк — Центр', lat: 50.7472, lng: 25.3254, city: 'Луцьк' };
                const dup = realSt.some(s => km(s, lutsk) < 3);
                if (!dup) realSt.push({
                    ...lutsk,
                    data: {
                        aqi: iq.current?.pollution?.aqius, pm25: iq.current?.pollution?.p2?.conc,
                        temp: iq.current?.weather?.tp, humidity: iq.current?.weather?.hu,
                        wind_speed: iq.current?.weather?.ws, pressure: iq.current?.weather?.pr, source: 'iqair'
                    },
                    hasReal: true, iqSource: true
                });
            }

            // Open-Meteo — погода для кожної станції паралельно
            await Promise.all(realSt.map(async st => {
                const wx2 = await fetchWeather(st.lat, st.lng);
                st.wx = wx2;
                if (wx2?.current) {
                    const c = wx2.current;
                    st.data.temp = c.temperature_2m;
                    st.data.humidity = c.relative_humidity_2m;
                    st.data.wind_speed = c.wind_speed_10m;
                    st.data.pressure = c.surface_pressure;
                    st.data.weather_code = c.weather_code;
                }
            }));

            S.stations = realSt;
            S.weather = realSt[0]?.wx || null; // Для зворотної сумісності — перша станція
            S.iqair = iq;
            // Якщо точний полігон OSM вже завантажено — фільтруємо одразу
            S.radiation = (rad.radiation || []).filter(s => !S.volynPoly || inRegion(s.lat, s.lng));
            S.sebAir = rad.air || [];
            S.ecowitt = ew;

            renderMap();
            renderRadiation();
            renderEWMarker();
            // Сітка температури/вітру (в фоні)
            fetchGridForecast().then(gd => { S.gridData = gd; buildTempLayer(); buildWindLayer(); }).catch(() => { });
            renderAll();
            document.getElementById('lupd').textContent = `Оновлено: ${new Date().toLocaleTimeString('uk-UA')}`;
            document.getElementById('stxt').innerHTML = `Станцій: ${S.stations.length} | <i class="ph-duotone ph-map-pin ico-accent"></i> IQAir: ${iq ? '<i class="ph-duotone ph-check-circle ico-green"></i>' : '<i class="ph-duotone ph-warning ico-warn"></i>'} | <i class="ph-duotone ph-radioactive ico-rad"></i> Радіація: ${S.radiation.length || '—'} | <i class="ph-duotone ph-plant ico-green"></i> EcoWitt: ${S.ecowitt ? '<i class="ph-duotone ph-check-circle ico-green"></i>' : '—'}`;
            showLoad(false);
        }

        // ═══════════════════════════════════════════════
        // MAP RENDER
        // ═══════════════════════════════════════════════
        function renderRadiation() {
            S.radMarkers.forEach(m => map.removeLayer(m));
            S.radMarkers = [];
            if (!S.layers.has('radiation') || !S.radiation.length) return;
            for (const s of S.radiation) {
                const col = radColor(s.value);
                const icon = L.divIcon({
                    className: '',
                    html: `<div style="background:${col};width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 10px ${col};display:flex;align-items:center;justify-content:center;font-size:8px">☢</div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });
                const [lbl] = radLabel(s.value);
                const mk = L.marker([s.lat, s.lng], { icon }).addTo(map).bindPopup(
                    `<div><div class="ppt"><i class="ph-duotone ph-radioactive ico-rad"></i> Датчик #${s.id}</div>
                <div class="ppr"><span>Доза</span><span class="ppv">${s.value?.toFixed(3) || '—'} ${s.unit}</span></div>
                <div class="ppr"><span>Статус</span><span class="ppv">${lbl}</span></div>
                <div style="font-size:10px;color:var(--text2);margin-top:5px">Джерело: SaveEcoBot</div>
                </div>`, { maxWidth: 220 });
                S.radMarkers.push(mk);
            }
        }

        // ─── Grid сітка температури/вітру (10×11 = 110 точок, фільтр по межах Волині) ──
        const GRID_PTS = [];
        for (const lat of [50.05, 50.25, 50.45, 50.65, 50.85, 51.05, 51.25, 51.45, 51.65, 51.85])
            for (const lng of [23.30, 23.55, 23.80, 24.05, 24.30, 24.55, 24.80, 25.05, 25.30, 25.55, 25.80])
                GRID_PTS.push({ lat, lng });

        function windArrowHtml(spd, dir) {
            // Синя гама: слабкий вітер = блакитний, сильний = темно-синій
            const col = spd < 2 ? '#bfdbfe' : spd < 4 ? '#60a5fa' : spd < 7 ? '#3b82f6' : spd < 10 ? '#1d4ed8' : '#7c3aed';
            return `<div class="wind-arrow">
                <svg width="28" height="28" viewBox="0 0 28 28" style="transform:rotate(${dir || 0}deg)">
                    <polygon points="14,3 17,20 14,17 11,20" fill="${col}" opacity="0.95" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))"/>
                    <circle cx="14" cy="14" r="2.2" fill="${col}" opacity="0.55"/>
                </svg>
                <span style="color:${col};font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9)">${spd.toFixed(1)}</span>
            </div>`;
        }

        function tempToColor(t) {
            if (t < 0) return '#1d4ed8'; if (t < 5) return '#0284c7'; if (t < 10) return '#0891b2';
            if (t < 15) return '#0d9488'; if (t < 20) return '#16a34a'; if (t < 25) return '#ca8a04';
            if (t < 30) return '#ea580c'; return '#dc2626';
        }

        async function fetchGridForecast() {
            // Open-Meteo підтримує масив координат в одному запиті (до 1000 точок)
            try {
                const lats = GRID_PTS.map(p => p.lat).join(',');
                const lngs = GRID_PTS.map(p => p.lng).join(',');
                const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current=temperature_2m,wind_speed_10m,wind_direction_10m&timezone=Europe%2FKyiv`);
                const data = await r.json();
                // відповідь — масив об'єктів якщо багато точок, або один об'єкт якщо одна
                const arr = Array.isArray(data) ? data : [data];
                return GRID_PTS.map((pt, i) => {
                    const c = arr[i]?.current || {};
                    return { ...pt, temp: c.temperature_2m ?? null, windSpeed: c.wind_speed_10m ?? null, windDir: c.wind_direction_10m ?? null };
                });
            } catch {
                return GRID_PTS.map(pt => ({ ...pt, temp: null, windSpeed: null, windDir: null }));
            }
        }

        function buildTempLayer() {
            if (S.tempLayer) { map.removeLayer(S.tempLayer); S.tempLayer = null; }
            if (!S.layers.has('temp-grid') || !S.gridData.length) return;
            const layer = L.layerGroup();
            for (const pt of S.gridData) {
                if (pt.temp == null || !inRegion(pt.lat, pt.lng)) continue;
                const col = tempToColor(pt.temp);
                const icon = L.divIcon({ className: '', html: `<div class="temp-chip" style="background:${col}">${pt.temp.toFixed(1)}°</div>`, iconSize: [38, 18], iconAnchor: [19, 9] });
                L.marker([pt.lat, pt.lng], { icon, interactive: false }).addTo(layer);
            }
            S.tempLayer = layer;
            S.tempLayer.addTo(map);
        }

        function buildWindLayer() {
            if (S.windLayer) { map.removeLayer(S.windLayer); S.windLayer = null; }
            if (!S.layers.has('wind-grid') || !S.gridData.length) return;
            const layer = L.layerGroup();
            for (const pt of S.gridData) {
                if (pt.windSpeed == null || !inRegion(pt.lat, pt.lng)) continue;
                const icon = L.divIcon({ className: '', html: windArrowHtml(pt.windSpeed, pt.windDir), iconSize: [36, 44], iconAnchor: [18, 22] });
                L.marker([pt.lat, pt.lng], { icon }).bindTooltip(`${pt.windSpeed.toFixed(1)} м/с · ${pt.windDir}°`, { direction: 'top', offset: [0, -22] }).addTo(layer);
            }
            S.windLayer = layer;
            S.windLayer.addTo(map);
        }

        // EcoWitt — точка ЛНТУ на карті
        const EW_LAT = 50.7358, EW_LNG = 25.3247;
        function renderEWMarker() {
            if (S.ewMarker) { map.removeLayer(S.ewMarker); S.ewMarker = null; }
            if (!S.layers.has('ecowitt') || !S.ecowitt) return;
            const ew = S.ecowitt;
            const f = (v, dec = 1) => v != null ? v.toFixed(dec) : '—';
            const icon = L.divIcon({
                className: '',
                html: `<div style="background:#34d399;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 12px #34d399"></div>`,
                iconSize: [16, 16], iconAnchor: [8, 8]
            });
            const popup = `<div>
          <div class="ppt"><i class="ph-duotone ph-plant ico-green"></i> EcoWitt — ЛНТУ</div>
          <div style="font-size:10px;color:var(--text2);margin-bottom:7px">Метеостанція Луцького НТУ</div>
          <div class="ppr"><span><i class="ph-duotone ph-thermometer ico-blue"></i> Outdoor</span><span class="ppv">${f(ew.tempOut)}°C / ${f(ew.humOut, 0)}%</span></div>
          <div class="ppr"><span><i class="ph-duotone ph-house ico-green"></i> Indoor</span><span class="ppv">${f(ew.tempIn)}°C / ${f(ew.humIn, 0)}%</span></div>
          <div class="ppr"><span><i class="ph-duotone ph-wind ico-purple"></i> Вітер</span><span class="ppv">${f(ew.windSpeed)} м/с (пор. ${f(ew.windGust)})</span></div>
          <div class="ppr"><span><i class="ph-duotone ph-gauge ico-blue"></i> Тиск</span><span class="ppv">${f(ew.pressureRel, 0)} гПа</span></div>
          <div class="ppr"><span>☀️ Сонце / УФ</span><span class="ppv">${f(ew.solar, 0)} Вт/м² · UVI ${f(ew.uvi, 0)}</span></div>
          <div class="ppr"><span><i class="ph-duotone ph-cloud-rain ico-blue"></i> Опади</span><span class="ppv">${f(ew.rainDaily)} мм/добу</span></div>
          ${ew.soilMoisture != null ? `<div class="ppr"><span>🌱 Ґрунт</span><span class="ppv">${f(ew.soilMoisture, 0)}% вологість</span></div>` : ''}
          <div style="font-size:10px;color:var(--text2);margin-top:5px">Джерело: EcoWitt API</div>
        </div>`;
            S.ewMarker = L.marker([EW_LAT, EW_LNG], { icon }).addTo(map).bindPopup(popup, { maxWidth: 260 });
        }

        function renderMap() {
            S.markers.forEach(m => map.removeLayer(m));
            S.circles.forEach(c => map.removeLayer(c));
            S.markers = []; S.circles = [];

            if (S.regionLayer) {
                if (S.layers.has('region')) S.regionLayer.addTo(map);
                else map.removeLayer(S.regionLayer);
            }

            if (!S.layers.has('stations')) return;

            const ap = [...S.params][0] || 'pm25';

            for (const st of S.stations) {
                const v = st.data[ap] || 0, lim = PL[ap] || 50, col = aqiColor(v, lim);

                {
                    const c = L.circle([st.lat, st.lng], { radius: 9000, color: col, fillColor: col, fillOpacity: .12, weight: 0 }).addTo(map);
                    S.circles.push(c);
                }

                const icon = L.divIcon({ className: '', html: `<div style="background:${col};width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.55);box-shadow:0 0 8px ${col}"></div>`, iconSize: [13, 13], iconAnchor: [6, 6] });
                const mk = L.marker([st.lat, st.lng], { icon }).addTo(map).bindPopup(buildPopup(st), { maxWidth: 270 });
                S.markers.push(mk);
            }
        }

        function buildPopup(st) {
            const d = st.data;
            const srcLabel = st.iqSource ? '<span style="color:#e879f9;font-size:10px">● IQAir</span>' : st.sebSource ? '<span style="color:#34d399;font-size:10px">● SaveEcoBot</span>' : st.hasReal ? '<span style="color:#34d399;font-size:10px">● OpenAQ</span>' : '<span style="color:#f59e0b;font-size:10px">● Модель</span>';
            const fields = [
                ['PM2.5', d.pm25, 'мкг/м³', PL.pm25],
                ['PM10', d.pm10, 'мкг/м³', PL.pm10],
                ['AQI', d.aqi, '', PL.aqi],
            ].map(([k, v, u, lim]) => {
                if (v == null) return '';
                const [, cls] = aqiLabel(v, lim);
                return `<div class="ppr"><span>${k}</span><span class="ppv ${cls}">${+v.toFixed(1)}${u ? ' ' + u : ''}</span></div>`;
            }).join('');
            return `<div><div class="ppt"><i class="ph-duotone ph-map-pin ico-accent"></i> ${st.name}</div>
    <div style="margin-bottom:7px;display:flex;justify-content:space-between">${srcLabel}<span style="font-size:10px;color:var(--text2)">${st.city}</span></div>
    ${fields}
    ${d.temp != null ? `<div class="ppr"><span><i class="ph-duotone ph-thermometer ico-blue"></i> Температура</span><span class="ppv">${d.temp.toFixed(1)}°C</span></div>` : ''}
    ${d.humidity != null ? `<div class="ppr"><span><i class="ph-duotone ph-drop ico-blue"></i> Вологість</span><span class="ppv">${d.humidity.toFixed(0)}%</span></div>` : ''}
    ${d.wind_speed != null ? `<div class="ppr"><span><i class="ph-duotone ph-wind ico-purple"></i> Вітер</span><span class="ppv">${d.wind_speed.toFixed(1)} м/с</span></div>` : ''}
    ${d.pressure != null ? `<div class="ppr"><span><i class="ph-duotone ph-gauge ico-blue"></i> Тиск</span><span class="ppv">${d.pressure.toFixed(0)} гПа</span></div>` : ''}
    ${d.temp != null ? `<div style="font-size:10px;color:var(--text2);margin-top:5px"><i class="ph-duotone ph-cloud-sun ico-blue"></i> Погода: Open-Meteo</div>` : ''}
  </div>`;
        }

        // ═══════════════════════════════════════════════
        // BOTTOM PANELS
        // ═══════════════════════════════════════════════
        function renderAll() { renderSt(); renderWx(); renderIQ(); renderEW(); }

        function renderEW() {
            const el = document.getElementById('tab-ew');
            if (!el) return;
            const ew = S.ecowitt;
            if (!ew) {
                const hasKeys = CFG.ECOWITT_APP_KEY && CFG.ECOWITT_API_KEY && CFG.ECOWITT_MAC;
                el.innerHTML = `<div class="nd" style="text-align:left;padding:14px">
      <b style="color:var(--warn)"><i class="ph-duotone ph-plant ico-green"></i> EcoWitt — метеостанція ЛНТУ</b><br><br>
      ${hasKeys ? '<b style="color:#ef4444">❌ Помилка підключення. Перевірте ключі.</b>' : '<b>Для підключення потрібні API ключі:</b>'}<br><br>
      1. Зайти на <a href="https://api.ecowitt.net" target="_blank" style="color:var(--accent)">api.ecowitt.net</a> → Developer<br>
      2. Create Application → отримати <code>application_key</code><br>
      3. Додати пристрій → отримати <code>api_key</code> та MAC<br>
      4. Вставити в CFG у коді або в <code>.env</code> файл<br><br>
      <span style="color:var(--text2);font-size:10px">Станція: ecowitt.net/home/index?id=65950</span>
    </div>`;
                return;
            }
            const f = (v, dec = 1) => v != null ? v.toFixed(dec) : '—';
            el.innerHTML = `
      <div class="dc"><div class="dct"><i class="ph-duotone ph-thermometer ico-blue"></i> Outdoor</div><div class="dcv" style="color:#60a5fa">${f(ew.tempOut)}<span class="dcu">°C</span></div><div class="dcs">${f(ew.humOut, 0)}% вологість</div></div>
      <div class="dc"><div class="dct"><i class="ph-duotone ph-house ico-green"></i> Indoor</div><div class="dcv" style="color:#34d399">${f(ew.tempIn)}<span class="dcu">°C</span></div><div class="dcs">${f(ew.humIn, 0)}% вологість</div></div>
      <div class="dc"><div class="dct"><i class="ph-duotone ph-wind ico-purple"></i> Вітер</div><div class="dcv" style="color:#a78bfa">${f(ew.windSpeed)}<span class="dcu">м/с</span></div><div class="dcs">Пориви: ${f(ew.windGust)} м/с</div></div>
