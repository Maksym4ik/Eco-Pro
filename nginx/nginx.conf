worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream eco_app {
        server eco-widget:3000;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP → HTTPS when certs are present
        # Uncomment after placing certs in nginx/certs/
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass         http://eco_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # Cache static assets
            location ~* \.(js|css|png|ico|svg)$ {
                proxy_pass http://eco_app;
                proxy_cache_valid 200 1h;
                add_header Cache-Control "public, max-age=3600";
            }
        }

        # Rate-limit API proxy calls
        location /proxy/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://eco_app;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server — uncomment and configure after adding TLS certs
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location / {
    #         proxy_pass http://eco_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    # }
}
